          PATCH_EOF
          git apply --check tts.patch
          git apply tts.patch
          rm tts.patch

          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add -A
          git status --short
          git commit -F - <<'MSG_EOF'
          Add optional text-to-speech reading of subtitles

          Reads the subtitle line that is currently on screen out loud with the
          device text-to-speech engine. Adds a "Read subtitles aloud" group at the
          top of Settings > Player > Subtitle settings with:

          - on/off switch, reading language and voice selection
          - option to show or hide the on-screen subtitle while it is read
          - original video volume (%) while a line is being read
          - reading speed
          - auto speed-up when the voice falls behind, with a maximum speed
          - skip lines that wait longer than a chosen time
          - an optional mode that pauses the video until the line is read

          AI disclosure: this change was written with AI assistance (Claude).

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          MSG_EOF

