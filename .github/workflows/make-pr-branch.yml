name: Make PR branch (subtitle read-aloud)

# Chay trong ban FORK cua ban (khong phai repo chinh thuc).
# Workflow lay nhanh master moi nhat cua CloudStream, ap tinh nang doc phu de,
# tao commit va day len nhanh "subtitle-tts" trong fork cua ban.
# Sau do mo link trong phan Summary de tao Pull Request.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create branch from upstream master and apply the change
